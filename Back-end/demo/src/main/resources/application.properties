# Configuração básica do Servidor
server.port=8080

# ----------------- CONFIGURAÇÕES DO MARIA DB -----------------

# URL de Conexão com o Banco de Dados (substitua a porta, se necessário)
spring.datasource.url=jdbc:mariadb://localhost:3306/seu-banco-de-dados
spring.datasource.username=seu-usuario-mariadb
spring.datasource.password=sua-senha-mariadb

# Driver para o MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configurações do Hibernate (Mapeamento Objeto-Relacional)
# 'update' tenta criar/atualizar as tabelas automaticamente com base nas suas Entidades (Task.java)
spring.jpa.hibernate.ddl-auto=update

# Opcional: Mostra as queries SQL executadas no console (útil para debug)
spring.jpa.show-sql=true

# Dialeto (otimiza o SQL gerado para o MariaDB)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect