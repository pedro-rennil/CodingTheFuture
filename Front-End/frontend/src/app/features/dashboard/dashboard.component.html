<div class="space-y-8">
    <header class="pb-4 border-b border-gray-200">
        <h1 class="text-4xl font-extrabold text-gray-900">Dashboard de Planejamento</h1>
        <p class="mt-1 text-lg text-gray-500">
            Envie documentos e visualize o backlog gerado pela IA.
        </p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1">
            <h2 class="text-2xl font-semibold mb-3 text-gray-800">1. Análise de Documentos</h2>
            <app-document-upload />
        </div>
        
        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow border border-gray-100">
            <h2 class="text-2xl font-semibold mb-3 text-gray-800">2. Resumo do Projeto (KPIs)</h2>
            <p class="text-gray-500">
                Aqui você veria métricas como Taxa de Conclusão, Total de Tarefas e Tempo Médio Estimado.
            </p>
            <div *ngIf="isLoading$ | async" class="mt-4 text-center p-8 text-indigo-600">
                Carregando dados iniciais...
            </div>
        </div>
    </div>
    
    <div class="pt-4">
        <h2 class="text-2xl font-semibold mb-4 text-gray-800 border-b pb-2">3. Backlog Gerado</h2>
        <app-enhanced-backlog-panel 
            [tasks]="tasks$ | async" 
            (statusChange)="onTaskStatusChange($event)" />
    </div>
</div>
