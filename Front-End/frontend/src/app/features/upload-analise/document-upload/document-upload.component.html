<div class="document-upload-container">
  <h2>Enviar Documento para Análise de IA</h2>
  
  <input 
    type="file" 
    (change)="onFileSelected($event)" 
    accept=".pdf,.txt,.docx"
    [disabled]="isAnalyzing"
  >

  <button 
    (click)="startAnalysis()" 
    [disabled]="!selectedFile || isAnalyzing"
    class="primary-button"
  >
    {{ isAnalyzing ? 'Analisando Requisitos...' : 'Iniciar Análise com IA' }}
  </button>

  <div *ngIf="isAnalyzing" class="analysis-progress">
    <p>Status: Processando dados. Tempo estimado: até 15 minutos (SMART 007)</p>
    <progress [value]="progress" max="100"></progress>
    <span>{{ progress }}% Completo</span>
  </div>

  <div *ngIf="isComplete" class="analysis-complete">
    ✅ Análise concluída! Navegando para o Backlog...
  </div>

  <div *ngIf="viewingDocumentName" class="document-viewer-link">
    <button (click)="viewLastDocument.emit()" class="text-link">
      📄 Visualizar último documento analisado: {{ viewingDocumentName }}
    </button>
  </div>

</div>
