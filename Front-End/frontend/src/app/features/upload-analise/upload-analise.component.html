<div class="p-6 bg-white rounded-lg shadow-md border border-gray-100 h-full">
    <h3 class="text-xl font-semibold mb-4 text-gray-700">Upload para Análise de IA</h3>
    <p class="mb-4 text-sm text-gray-500">
        Envie documentos (como especificações ou requisitos) para a IA gerar um backlog detalhado.
    </p>
    
    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
        <input 
            type="file" 
            (change)="onFileSelected($event)" 
            formControlName="documentFile"
            accept=".pdf,.docx,.doc,.txt"
            class="file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
        />
        
        <button 
            type="submit" 
            [disabled]="uploadForm.invalid || isAnalyzing"
            class="mt-4 w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white transition-colors 
                   "
            [ngClass]="{'bg-indigo-600 hover:bg-indigo-700': !isAnalyzing, 'bg-gray-400': isAnalyzing}"
        >
            <span *ngIf="!isAnalyzing">Analisar Documento</span>
            <span *ngIf="isAnalyzing">Analisando...</span>
        </button>
    </form>

    <div *ngIf="isAnalyzing" class="mt-4 p-4 border border-indigo-200 rounded-lg bg-indigo-50">
        <p class="text-sm font-medium text-indigo-700 mb-2">
            Análise em progresso: {{ analysisProgress }}%
        </p>
        <div class="w-full bg-indigo-200 rounded-full h-2.5">
            <div 
                class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" 
                [style.width.%]="analysisProgress"
            ></div>
        </div>
    </div>
    
    <div *ngIf="viewingDocumentName" class="mt-4 p-3 bg-green-100 rounded-md text-green-800 text-sm border border-green-200">
        <p class="font-semibold">✅ Documento Analisado:</p>
        <p>Tarefas geradas a partir de <strong>{{ viewingDocumentName }}</strong> e adicionadas ao Backlog.</p>
    </div>
</div>
