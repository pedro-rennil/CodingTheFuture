<div [class]="'flex items-center gap-3 ' + className">
  <div [class]="'relative ' + containerClass">
    <svg
      viewBox="0 0 100 100"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="h-full w-full"
    >
      <!-- Gradient definitions -->
      <defs>
        <linearGradient
          id="waveGradient"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%"
        >
          <stop offset="0%" stop-color="#2B6CB0" />
          <stop offset="100%" stop-color="#6B46C1" />
        </linearGradient>
        <linearGradient
          id="sparkleGradient"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%"
        >
          <stop offset="0%" stop-color="#6B46C1" />
          <stop offset="100%" stop-color="#9F7AEA" />
        </linearGradient>
      </defs>

      <!-- Curved waves inspired by company logo -->
      <path
        d="M 20 25 Q 30 20, 40 25 T 60 25 Q 70 20, 75 30"
        stroke="url(#waveGradient)"
        stroke-width="6"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M 20 40 Q 32 35, 45 40 T 70 40"
        stroke="url(#waveGradient)"
        stroke-width="6"
        stroke-linecap="round"
        fill="none"
        opacity="0.85"
      />
      <path
        d="M 20 55 Q 35 50, 50 55 T 75 55"
        stroke="url(#waveGradient)"
        stroke-width="6"
        stroke-linecap="round"
        fill="none"
        opacity="0.7"
      />
      <path
        d="M 25 70 Q 40 65, 55 70 T 80 70"
        stroke="url(#waveGradient)"
        stroke-width="5"
        stroke-linecap="round"
        fill="none"
        opacity="0.55"
      />

      <!-- AI Neural network nodes -->
      <circle cx="75" cy="30" r="4" fill="url(#sparkleGradient)" />
      <circle cx="70" cy="40" r="3" fill="url(#sparkleGradient)" opacity="0.8" />
      <circle cx="75" cy="55" r="3.5" fill="url(#sparkleGradient)" opacity="0.9" />
      <circle cx="80" cy="70" r="3" fill="url(#sparkleGradient)" opacity="0.7" />

      <!-- Connection lines for AI nodes -->
      <line
        x1="75"
        y1="30"
        x2="70"
        y2="40"
        stroke="#6B46C1"
        stroke-width="1"
        opacity="0.3"
      />
      <line
        x1="70"
        y1="40"
        x2="75"
        y2="55"
        stroke="#6B46C1"
        stroke-width="1"
        opacity="0.3"
      />
      <line
        x1="75"
        y1="55"
        x2="80"
        y2="70"
        stroke="#6B46C1"
        stroke-width="1"
        opacity="0.3"
      />

      <!-- Sparkle effect for AI -->
      <path
        d="M 85 20 L 86 22 L 88 23 L 86 24 L 85 26 L 84 24 L 82 23 L 84 22 Z"
        fill="url(#sparkleGradient)"
      />
      <path
        d="M 78 15 L 78.5 16 L 79.5 16.5 L 78.5 17 L 78 18 L 77.5 17 L 76.5 16.5 L 77.5 16 Z"
        fill="url(#sparkleGradient)"
        opacity="0.7"
      />
    </svg>
  </div>
  
  <div *ngIf="showText">
    <p [class]="textClass + ' text-gray-900'">StefAI Plan</p>
  </div>
</div>
