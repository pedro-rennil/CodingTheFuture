<header class="fixed left-0 right-0 top-0 z-50 h-16 border-b bg-white shadow-sm">
  <div class="flex h-full items-center justify-between px-4">
    <!-- Left Side -->
    <div class="flex items-center gap-3">
      <app-logo [showText]="true" [size]="'md'"></app-logo>
      
      <div class="flex items-center gap-1.5 rounded-full bg-gradient-to-r from-[#2B6CB0]/10 to-[#6B46C1]/10 px-3 py-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[#6B46C1]">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span class="text-xs text-[#2B6CB0]">IA Ativa</span>
      </div>
    </div>

    <!-- Right Side -->
    <div class="flex items-center gap-3">
      <!-- User Profile Button -->
      <button
        (click)="onProfileClick()"
        class="flex items-center gap-3 rounded-lg px-3 py-2 transition-colors hover:bg-gray-100"
        title="Ver perfil"
      >
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-[#2B6CB0] to-[#6B46C1] text-white text-sm font-medium">
          {{ initials }}
        </div>
        <span class="text-sm text-gray-900">{{ userName }}</span>
      </button>

      <!-- Logout Button -->
      <button
        (click)="onLogoutClick()"
        class="flex items-center gap-2 rounded-md px-3 py-2 text-gray-600 hover:bg-gray-100 hover:text-gray-900"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sair
      </button>
    </div>
  </div>
</header>
